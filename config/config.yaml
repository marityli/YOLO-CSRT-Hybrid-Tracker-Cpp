# ============================================================
#  ObjectTracking 配置文件
#  说明：本文件中所有相对路径均以【项目根目录】为基准，
#        因此程序必须在项目根目录下运行（tracking_cpp.exe 所在层）。
#        每个参数都可以只写一部分，缺失的键会回退到代码里的默认值，
#        并在控制台打印一条告警，不会直接启动失败。
# ============================================================

# ------------------------------------------------------------
#  相机采集
# ------------------------------------------------------------
camera:
  id: 0                     # 摄像头设备号，0 = 系统默认摄像头；外接摄像头可试 1、2
  width: 640                # 请求的采集宽度（实际分辨率由摄像头能力决定）
  height: 480               # 请求的采集高度

# ------------------------------------------------------------
#  视频录制
# ------------------------------------------------------------
video:
  path: results/tracking_result.mp4   # 输出视频路径，父目录不存在会自动创建
  fps: 30                             # 写入视频的帧率（建议与相机实际帧率一致）
  fourcc: mp4v                        # 编码四字符码：mp4v / XVID / MJPG / avc1
                                      #   注意：写回放的帧率错配会导致快放/慢放

# ------------------------------------------------------------
#  YOLO 检测模型 / ONNX Runtime
# ------------------------------------------------------------
model:
  path: models/yolo11n.onnx # ONNX 模型文件路径（.onnx 已由 .gitignore 忽略，需自行放置）
  confidence_threshold: 0.5 # 置信度阈值，低于该值的检测框直接丢弃
  nms_threshold: 0.45       # NMS 的 IoU 阈值，越大保留的重叠框越多
  input_width: 640          # 网络输入宽度（YOLO11n 导出后为 640，非 640 需确认模型支持）
  input_height: 640         # 网络输入高度
  intra_op_threads: 1       # ONNX Runtime 算子内并行线程数，0 = 由 ORT 按物理核心自动决定
                            #   旧版本此处硬编码为 1，会限制推理吞吐；如遇 CPU 争抢可改回 1
  use_cuda: true            # 是否启用 CUDA 执行提供器；false 时回退到 CPU 推理
  cuda_device_id: 0         # CUDA 设备号，多卡时指定使用的 GPU
  profile_interval: 30      # 检测器内部耗时（预处理/推理/后处理）打印间隔，单位帧

# ------------------------------------------------------------
#  检测 / 跟踪调度
# ------------------------------------------------------------
tracking:
  detection_interval: 15    # 每隔多少帧执行一次 YOLO 检测，其余帧由跟踪器递推
                            #   调小 = 更准但更慢；调大 = 更快但漂移更明显
  target_class_id: 0        # 只跟踪的类别 ID（COCO 中 0 = person），其他类别一律忽略
  iou_threshold: 0.3        # 数据关联门控：预测框与检测框 IoU 低于该值则不认为是同一目标
                            #   调大可减少 ID 跳变，调小可抵抗快速运动
  reinit_iou_threshold: 0.6 # 已匹配但 IoU 低于该值时重置跟踪器，抑制长期漂移
                            #   设为 1.0 表示每帧都重置（很慢），设为 0 表示从不重置
  max_lost_frames: 30       # 连续多少帧匹配失败后删除该轨迹（30 帧 @30fps ≈ 1 秒）
  kalman:                   # 卡尔曼滤波器噪声参数（用于预测轨迹位置）
    process_noise: 0.01     # processNoiseCov 对角值，越大表示越信任观测、响应越快
    measurement_noise: 0.1  # measurementNoiseCov 对角值，越大表示越信任预测、越平滑
    error_cov_post: 1.0     # 初始误差协方差 errorCovPost 的对角值

# ------------------------------------------------------------
#  日志
# ------------------------------------------------------------
logging:
  path: logs/tracking.log   # 日志文件路径，父目录不存在会自动创建；以追加方式写入
  level: INFO               # 最低记录级别：DEBUG / INFO / WARNING / ERROR
  console: true             # 是否同时输出到控制台（关闭后只写文件）

# ------------------------------------------------------------
#  显示 / 性能分析
# ------------------------------------------------------------
display:
  window_name: "YOLO + CSRT Hybrid Tracking"  # imshow 窗口标题
  show_window: true         # false 时不弹窗（适合纯录制 / 无头场景），按 q 退出的功能同时失效
  draw_fps: true            # 是否在画面右下角绘制实时 FPS
  profile_interval: 10      # 主循环分段耗时（读帧/检测跟踪/绘制录像）打印间隔，单位帧
